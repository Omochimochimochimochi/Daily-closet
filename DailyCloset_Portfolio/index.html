
{% load static %}
<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Closet | Portfolio</title>

    <link rel="stylesheet" href="{% static 'portfolio/style.css' %}">
</head>

<body>

<header>
    <h1>Daily Closet</h1>
</header>

<main>

 
<!-- アプリ画面紹介 -->
<section class="app-screens">

    <h2>アプリ画面紹介</h2>

    <div class="screen-gallery">

        <div class="screen-item">
            <img src="{% static 'portfolio/images/search_screen.png' %}"
                 alt="商品検索画面">
            <h3>商品検索</h3>
            <p>ハッシュタグを組み合わせて、自分に合った商品を検索できます。</p>
        </div>

        <div class="screen-item">
            <img src="{% static 'portfolio/images/item_list.png' %}"
                 alt="商品一覧画面">
            <h3>商品一覧</h3>
            <p>検索条件に合った商品を一覧で確認できます。</p>
        </div>

        <div class="screen-item">
            <img src="{% static 'portfolio/images/item_detail.png' %}"
                 alt="商品詳細画面">
            <h3>商品詳細</h3>
            <p>商品情報やディテール画像を確認できます。</p>
        </div>

        <div class="screen-item">
            <img src="{% static 'portfolio/images/favorite_list.png' %}"
                 alt="お気に入り画面">
            <h3>お気に入り</h3>
            <p>気になる商品をお気に入りに登録できます。</p>
        </div>

    </div>

</section>



    <!-- 資料 -->
    <section>

        <h2>資料</h2>

        <div class="document-list">

            <a href="{% static 'portfolio/documents/planning.pdf' %}"
               target="_blank">
                📄 企画書
            </a>

            <a href="{% static 'portfolio/documents/ER図.png' %}"
               target="_blank">
                🗄 ER図
            </a>

            <a href="{% static 'portfolio/documents/画面遷移図.png' %}"
               target="_blank">
                🔀 画面遷移図
            </a>

            <a href="{% static 'portfolio/documents/画面設計図.pdf' %}"
               target="_blank">
                ▤ 画面設計図
            </a>

        </div>

        <div class="app-button">
            <a href="https://dailycloset.pythonanywhere.com/"
               target="_blank"
               rel="noopener noreferrer">
                ▶ アプリを見る
            </a>
        </div>

    </section>

</main>

</body>
</html>
