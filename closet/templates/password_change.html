{% extends 'closet/base.html' %}
{% load static %}

{% block title %}パスワード変更{% endblock %}

{% block extra_css %}
<style>
.app-container{
    max-width:400px;
    margin:20px auto;
    padding:20px;
}

.header{
    text-align:center;
    margin-bottom:25px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:18px;
}

.input-wrapper{
    display:flex;
    flex-direction:column;
}

.label-text{
    margin-bottom:8px;
    font-size:14px;
    font-weight:bold;
    color:#555;
}

.password-input-container{
    position:relative;
}

.input-field{
    width:100%;
    padding:12px 45px 12px 12px;
    border:1px solid #ccc;
    border-radius:10px;
    box-sizing:border-box;
    font-size:16px;
}

.eye-icon{
    position:absolute;
    right:14px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    user-select:none;
}

.btn-update{
    width:100%;
    margin-top:30px;
    padding:14px;
    background:#7eb6ff;
    color:#fff;
    border:none;
    border-radius:25px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.btn-update:hover{
    background:#5d9ef5;
}
</style>
{% endblock %}

{% block content %}

<div class="app-container">

    <div class="header">
        <h1>パスワード変更 🔑</h1>
    </div>

    <form method="post">
        {% csrf_token %}

        <div class="form-group">

            <div class="input-wrapper">
                <label class="label-text">現在のパスワード</label>

                <div class="password-input-container">
                    <input
                        type="password"
                        id="current-pass"
                        class="input-field"
                        placeholder="現在のパスワードを入力">

                    <span class="eye-icon"
                          onclick="togglePassword('current-pass')">👁️</span>
                </div>
            </div>

            <div class="input-wrapper">
                <label class="label-text">新しいパスワード</label>

                <div class="password-input-container">
                    <input
                        type="password"
                        id="new-pass"
                        class="input-field"
                        placeholder="8文字以上・英数字を含む">

                    <span class="eye-icon"
                          onclick="togglePassword('new-pass')">👁️</span>
                </div>
            </div>

            <div class="input-wrapper">
                <label class="label-text">新しいパスワード（確認）</label>

                <div class="password-input-container">
                    <input
                        type="password"
                        id="confirm-pass"
                        class="input-field"
                        placeholder="もう一度入力してください">

                    <span class="eye-icon"
                          onclick="togglePassword('confirm-pass')">👁️</span>
                </div>
            </div>

        </div>

        <button type="submit" class="btn-update">
            変更 🚀
        </button>

    </form>

</div>

{% endblock %}

{% block extra_js %}
<script>
function togglePassword(id){
    const input=document.getElementById(id);

    if(input.type==="password"){
        input.type="text";
    }else{
        input.type="password";
    }
}
</script>
{% endblock %}
