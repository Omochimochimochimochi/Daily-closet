
{% extends 'closet/base.html' %}
{% load static %}

{% block title %}パスワード変更{% endblock %}

{% block extra_css %}
<style>
/* この画面のコンテンツ */
.app-container {
    width: 100% !important;
    max-width: 375px !important;
    margin: 0 auto !important;
    padding: 20px 20px 100px !important;
    box-sizing: border-box !important;
    background: #fff;
}

/* 見出し */
.app-container .header {
    text-align: center;
    margin-bottom: 25px;
}

.app-container .header h1 {
    font-size: 28px;
    line-height: 1.4;
    margin: 20px 0;
    overflow-wrap: break-word;
}

/* フォーム全体 */
.app-container form,
.app-container .form-group,
.app-container .input-wrapper,
.app-container .password-input-container {
    width: 100%;
    min-width: 0;
    box-sizing: border-box;
}

.app-container .form-group {
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.app-container .input-wrapper {
    display: flex;
    flex-direction: column;
}

/* 入力欄のラベル */
.app-container .label-text {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
    font-weight: bold;
    color: #555;
}

/* パスワード入力欄 */
.app-container .password-input-container {
    position: relative;
}

.app-container .input-field {
    display: block;
    width: 100%;
    max-width: 100%;
    min-width: 0;
    padding: 12px 45px 12px 12px;
    border: 1px solid #ccc;
    border-radius: 10px;
    box-sizing: border-box;
    font-size: 16px;
    background: #fff;
    color: #333;
}

/* 目のアイコン：巨大化防止 */
.app-container .eye-icon {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #777;
    cursor: pointer;
    user-select: none;
    z-index: 2;
}

/* SVGのサイズを明示的に固定 */
.app-container .eye-icon svg {
    display: block;
    width: 20px !important;
    height: 20px !important;
    min-width: 20px;
    min-height: 20px;
    max-width: 20px;
    max-height: 20px;
    flex: 0 0 20px;
}

/* 非表示時は斜線あり */
.app-container .eye-icon .eye-slash {
    display: block;
}

/* 表示時は斜線を消す */
.app-container .eye-icon.is-visible .eye-slash {
    display: none;
}

/* 変更ボタン */
.app-container .btn-update {
    display: block;
    width: 100%;
    margin-top: 30px;
    padding: 14px;
    box-sizing: border-box;
    background: #7eb6ff;
    color: #fff;
    border: none;
    border-radius: 25px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: background-color .2s;
}

.app-container .btn-update:hover {
    background: #5d9ef5;
}

/* スマホ表示 */
@media (max-width: 375px) {
    .app-container {
        width: 100% !important;
        max-width: 375px !important;
        padding: 20px 20px 100px !important;
    }

    .app-container .header h1 {
        font-size: 25px;
    }
}
</style>
{% endblock %}

{% block content %}
<div class="app-container">

    <div class="header">
        <h1>パスワード変更 🔑</h1>
    </div>

    <form method="post">
        {% csrf_token %}

        {% if error %}
            <p style="color:red; text-align:center; margin-bottom:20px;">
                {{ error }}
            </p>
        {% endif %}

        <div class="form-group">

            <!-- 現在のパスワード -->
            <div class="input-wrapper">
                <label for="current-pass" class="label-text">
                    現在のパスワード
                </label>

                <div class="password-input-container">
                    <input
                        type="password"
                        id="current-pass"
                        name="current_password"
                        class="input-field"
                        placeholder="現在のパスワードを入力"
                        autocomplete="current-password"
                        required>

                    <span
                        class="eye-icon"
                        role="button"
                        tabindex="0"
                        aria-label="パスワードを表示"
                        aria-pressed="false"
                        onclick="togglePassword('current-pass', this)"
                        onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();togglePassword('current-pass',this)}">

                        <svg viewBox="0 0 24 24" fill="none"
                             stroke="currentColor"
                             stroke-width="1.8"
                             stroke-linecap="round"
                             stroke-linejoin="round"
                             aria-hidden="true">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
                            <circle cx="12" cy="12" r="3"/>
                            <path class="eye-slash" d="M3 3l18 18"/>
                        </svg>
                    </span>
                </div>
            </div>

            <!-- 新しいパスワード -->
            <div class="input-wrapper">
                <label for="new-pass" class="label-text">
                    新しいパスワード
                </label>

                <div class="password-input-container">
                    <input
                        type="password"
                        id="new-pass"
                        name="new_password"
                        class="input-field"
                        placeholder="8文字以上・英数字を含む"
                        autocomplete="new-password"
                        required>

                    <span
                        class="eye-icon"
                        role="button"
                        tabindex="0"
                        aria-label="パスワードを表示"
                        aria-pressed="false"
                        onclick="togglePassword('new-pass', this)"
                        onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();togglePassword('new-pass',this)}">

                        <svg viewBox="0 0 24 24" fill="none"
                             stroke="currentColor"
                             stroke-width="1.8"
                             stroke-linecap="round"
                             stroke-linejoin="round"
                             aria-hidden="true">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
                            <circle cx="12" cy="12" r="3"/>
                            <path class="eye-slash" d="M3 3l18 18"/>
                        </svg>
                    </span>
                </div>
            </div>

            <!-- 新しいパスワード（確認） -->
            <div class="input-wrapper">
                <label for="confirm-pass" class="label-text">
                    新しいパスワード（確認）
                </label>

                <div class="password-input-container">
                    <input
                        type="password"
                        id="confirm-pass"
                        name="new_password_confirm"
                        class="input-field"
                        placeholder="もう一度入力してください"
                        autocomplete="new-password"
                        required>

                    <span
                        class="eye-icon"
                        role="button"
                        tabindex="0"
                        aria-label="パスワードを表示"
                        aria-pressed="false"
                        onclick="togglePassword('confirm-pass', this)"
                        onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();togglePassword('confirm-pass',this)}">

                        <svg viewBox="0 0 24 24" fill="none"
                             stroke="currentColor"
                             stroke-width="1.8"
                             stroke-linecap="round"
                             stroke-linejoin="round"
                             aria-hidden="true">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
                            <circle cx="12" cy="12" r="3"/>
                            <path class="eye-slash" d="M3 3l18 18"/>
                        </svg>
                    </span>
                </div>
            </div>

        </div>

        <button type="submit" class="btn-update">
            変更 🚀
        </button>

    </form>
</div>
{% endblock %}

{% block extra_js %}
<script>
function togglePassword(id, icon) {
    const input = document.getElementById(id);

    if (!input || !icon) {
        return;
    }

    const isVisible = input.type === 'password';

    input.type = isVisible ? 'text' : 'password';

    icon.classList.toggle('is-visible', isVisible);

    icon.setAttribute(
        'aria-label',
        isVisible ? 'パスワードを非表示' : 'パスワードを表示'
    );

    icon.setAttribute('aria-pressed', String(isVisible));
}
</script>
{% endblock %}
