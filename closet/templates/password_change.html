
{% extends 'closet/base.html' %}
{% load static %}

{% block title %}パスワード変更{% endblock %}

{% block extra_css %}
<style>
.app-container {
    max-width: 400px;
    margin: 20px auto;
    padding: 20px;
    box-sizing: border-box;
}

.header {
    text-align: center;
    margin-bottom: 25px;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.input-wrapper {
    display: flex;
    flex-direction: column;
}

.label-text {
    margin-bottom: 8px;
    font-size: 14px;
    font-weight: bold;
    color: #555;
}

.password-input-container {
    position: relative;
    width: 100%;
}

.input-field {
    width: 100%;
    padding: 12px 45px 12px 12px;
    border: 1px solid #ccc;
    border-radius: 10px;
    box-sizing: border-box;
    font-size: 16px;
}

.eye-icon {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 20px;
    height: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #777;
    user-select: none;
}

/* 目の形 */
.eye-icon svg {
    width: 20px;
    height: 20px;
    display: block;
}

/* 非表示時の斜線 */
.eye-icon .eye-slash {
    display: block;
}

/* 表示時は斜線を消す */
.eye-icon.is-visible .eye-slash {
    display: none;
}

.btn-update {
    width: 100%;
    margin-top: 30px;
    padding: 14px;
    background: #7eb6ff;
    color: #fff;
    border: none;
    border-radius: 25px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
}

.btn-update:hover {
    background: #5d9ef5;
}

@media (max-width: 480px) {
    .app-container {
        width: 100%;
        padding: 20px;
    }
}
</style>
{% endblock %}

{% block content %}

<div class="app-container">

    <div class="header">
        <h1>パスワード変更 🔑</h1>
    </div>

    <form method="post">
        {% csrf_token %}

        {% if error %}
            <p style="color:red; text-align:center; margin-bottom:20px;">
                {{ error }}
            </p>
        {% endif %}

        <div class="form-group">

            <div class="input-wrapper">
                <label for="current-pass" class="label-text">
                    現在のパスワード
                </label>

                <div class="password-input-container">
                    <input
                        type="password"
                        id="current-pass"
                        name="current_password"
                        class="input-field"
                        placeholder="現在のパスワードを入力"
                        autocomplete="current-password"
                        required>

                    <span
                        class="eye-icon"
                        role="button"
                        tabindex="0"
                        aria-label="パスワードを表示"
                        aria-pressed="false"
                        onclick="togglePassword('current-pass', this)"
                        onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();togglePassword('current-pass',this)}">

                        <svg viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="1.8"
                             stroke-linecap="round" stroke-linejoin="round"
                             aria-hidden="true">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
                            <circle cx="12" cy="12" r="3"/>
                            <path class="eye-slash"
                                  d="M3 3l18 18"/>
                        </svg>
                    </span>
                </div>
            </div>

            <div class="input-wrapper">
                <label for="new-pass" class="label-text">
                    新しいパスワード
                </label>

                <div class="password-input-container">
                    <input
                        type="password"
                        id="new-pass"
                        name="new_password"
                        class="input-field"
                        placeholder="8文字以上・英数字を含む"
                        autocomplete="new-password"
                        required>

                    <span
                        class="eye-icon"
                        role="button"
                        tabindex="0"
                        aria-label="パスワードを表示"
                        aria-pressed="false"
                        onclick="togglePassword('new-pass', this)"
                        onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();togglePassword('new-pass',this)}">

                        <svg viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="1.8"
                             stroke-linecap="round" stroke-linejoin="round"
                             aria-hidden="true">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
                            <circle cx="12" cy="12" r="3"/>
                            <path class="eye-slash"
                                  d="M3 3l18 18"/>
                        </svg>
                    </span>
                </div>
            </div>

            <div class="input-wrapper">
                <label for="confirm-pass" class="label-text">
                    新しいパスワード（確認）
                </label>

                <div class="password-input-container">
                    <input
                        type="password"
                        id="confirm-pass"
                        name="new_password_confirm"
                        class="input-field"
                        placeholder="もう一度入力してください"
                        autocomplete="new-password"
                        required>

                    <span
                        class="eye-icon"
                        role="button"
                        tabindex="0"
                        aria-label="パスワードを表示"
                        aria-pressed="false"
                        onclick="togglePassword('confirm-pass', this)"
                        onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();togglePassword('confirm-pass',this)}">

                        <svg viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="1.8"
                             stroke-linecap="round" stroke-linejoin="round"
                             aria-hidden="true">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
                            <circle cx="12" cy="12" r="3"/>
                            <path class="eye-slash"
                                  d="M3 3l18 18"/>
                        </svg>
                    </span>
                </div>
            </div>

        </div>

        <button type="submit" class="btn-update">
            変更 🚀
        </button>

    </form>

</div>

{% endblock %}

{% block extra_js %}
<script>
function togglePassword(id, icon) {
    const input = document.getElementById(id);

    if (!input || !icon) {
        return;
    }

    const isVisible = input.type === 'password';

    input.type = isVisible ? 'text' : 'password';

    icon.classList.toggle('is-visible', isVisible);

    icon.setAttribute(
        'aria-label',
        isVisible ? 'パスワードを非表示' : 'パスワードを表示'
    );

    icon.setAttribute('aria-pressed', String(isVisible));
}
</script>
{% endblock %}
