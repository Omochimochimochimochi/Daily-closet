
<div class="app-container">
    <div class="header">
        <h1>パスワード変更 🔑</h1>
    </div>

 <div class="form-group">
    <div class="input-wrapper">
        <label class="label-text">現在のパスワード</label>
        <div class="password-input-container">
            <input type="password" id="current-pass" class="input-field" placeholder="現在のパスワードを入力">
            <span class="eye-icon" onclick="togglePassword('current-pass', this)">👁️</span>
        </div>
    </div>

    <div class="input-wrapper">
        <label class="label-text">新しいパスワード</label>
        <div class="password-input-container">
            <input type="password" id="new-pass" class="input-field" placeholder="8文字以上、英数字含む">
            <span class="eye-icon" onclick="togglePassword('new-pass', this)">👁️</span>
        </div>
    </div>

    <div class="input-wrapper">
        <label class="label-text">新しいパスワード（確認用）</label>
        <div class="password-input-container">
            <input type="password" id="confirm-pass" class="input-field" placeholder="もう一度入力してください">
            <span class="eye-icon" onclick="togglePassword('confirm-pass', this)">👁️</span>
        </div>
    </div>
</div>

        <button class="btn-update">変更 🚀</button>
    </div>
</div>

<script>
    function togglePassword(inputId, icon) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
            input.type = "text";
        } else {
            input.type = "password";
        }
    }
</script>
