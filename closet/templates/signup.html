{% extends 'closet/base.html' %}
{% load static %}

{% block title %}新規会員登録 - Daily Closet{% endblock %}

{% block content %}
<div style="padding: 20px; text-align: center;">
    <h2>新規会員登録</h2>
    
   
    
    
<style>
    .password-group { margin-bottom: 20px; text-align: left; }
    .input-container { position: relative; width: 100%; }
    .input-container input {
        width: 100%;
        padding: 10px;
        padding-right: 40px;
        box-sizing: border-box;
        border: 1px solid #ccc;
    }
    .toggle-icon {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        font-size: 18px;
        user-select: none;
    }
</style>

<script>
    function togglePassword(inputId) {
        const input = document.getElementById(inputId);
        input.type = (input.type === "password") ? "text" : "password";
    }
</script>
{% endblock %}
