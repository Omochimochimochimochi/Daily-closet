{% extends 'closet/base.html' %}
{% load static %}

{% block title %}新規会員登録 - Daily Closet{% endblock %}

{% block content %}

<div class="signup-container">

    <h2>新規会員登録</h2>
    {% if error %}
    <p style="color: red;">{{ error }}</p>
{% endif %}

    <form method="post">
        {% csrf_token %}

        <!-- メールアドレス -->
        <div class="form-group">
            <label for="email">メールアドレス</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="example@mail.com"
                required
            >
        </div>

        <!-- ユーザー名 -->
        <div class="form-group">
            <label for="username">ユーザー名</label>
            <input
                type="text"
                id="username"
                name="username"
                required
            >
        </div>

        <!-- パスワード -->
        <div class="form-group">
            <label for="password">パスワード</label>

            <div class="input-container">
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >

                <span
                    class="toggle-icon"
                    onclick="togglePassword('password')"
                >👁</span>
            </div>

            <p class="password-note">
                ・英数字含む<br>
                ・8文字以上
            </p>
        </div>

        <!-- パスワード再入力 -->
        <div class="form-group">
            <label for="password_confirm">パスワード再入力</label>

            <div class="input-container">
                <input
                    type="password"
                    id="password_confirm"
                    name="password_confirm"
                    required
                >

                <span
                    class="toggle-icon"
                    onclick="togglePassword('password_confirm')"
                >👁</span>
            </div>
        </div>

        <button type="submit" class="signup-button">
            登録
        </button>

    </form>

</div>

<style>
    .signup-container {
        max-width: 300px;
        margin: 30px auto;
        padding: 20px;
        text-align: center;
    }

    .signup-container h2 {
        margin-bottom: 30px;
    }

    .form-group {
        margin-bottom: 20px;
        text-align: left;
    }

    .form-group label {
        display: block;
        margin-bottom: 6px;
        text-align: center;
    }

    .form-group input {
        width: 100%;
        padding: 9px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 4px;
    }

    .input-container {
        position: relative;
        width: 100%;
    }

    .input-container input {
        padding-right: 40px;
    }

    .toggle-icon {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        font-size: 16px;
        user-select: none;
    }

    .password-note {
        margin: 5px 0 0;
        font-size: 11px;
        color: #666;
        text-align: center;
    }

    .signup-button {
        width: 130px;
        padding: 10px;
        margin-top: 10px;
        background: #a9c0ed;
        border: 1px solid #8da9df;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
    }
</style>

<script>
    function togglePassword(inputId) {
        const input = document.getElementById(inputId);

        if (input.type === "password") {
            input.type = "text";
        } else {
            input.type = "password";
        }
    }
</script>

{% endblock %}

{% block bottom_nav %}{% endblock %}
