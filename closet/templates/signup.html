
{% extends 'closet/base.html' %}
{% load static %}

{% block title %}新規会員登録 - Daily Closet{% endblock %}

{% block content %}

<div class="signup-container">

    <h2>新規会員登録</h2>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <!-- メールアドレス -->
        <div class="form-group">
            <label for="email">メールアドレス</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="example@mail.com"
                required
            >
        </div>

        <!-- ユーザー名 -->
        <div class="form-group">
            <label for="username">ユーザー名</label>
            <input
                type="text"
                id="username"
                name="username"
                required
            >
        </div>

        <!-- パスワード -->
        <div class="form-group">
            <label for="password">パスワード</label>

            <div class="input-container">
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >

                <button
                    type="button"
                    class="toggle-icon is-hidden"
                    onclick="togglePassword('password', this)"
                    aria-label="パスワードを表示"
                    aria-pressed="false"
                >
                    <span class="eye-icon"></span>
                </button>
            </div>

            <p class="password-note">
                ・英数字含む<br>
                ・8文字以上
            </p>
        </div>

        <!-- パスワード再入力 -->
        <div class="form-group">
            <label for="password_confirm">パスワード再入力</label>

            <div class="input-container">
                <input
                    type="password"
                    id="password_confirm"
                    name="password_confirm"
                    required
                >

                <button
                    type="button"
                    class="toggle-icon is-hidden"
                    onclick="togglePassword('password_confirm', this)"
                    aria-label="パスワードを表示"
                    aria-pressed="false"
                >
                    <span class="eye-icon"></span>
                </button>
            </div>
        </div>

        <button type="submit" class="signup-button">
            登録
        </button>

    </form>

</div>

<style>
    .signup-container {
        max-width: 300px;
        margin: 30px auto;
        padding: 20px;
        text-align: center;
    }

    .signup-container h2 {
        margin-bottom: 30px;
    }

    .form-group {
        margin-bottom: 20px;
        text-align: left;
    }

    .form-group label {
        display: block;
        margin-bottom: 6px;
        text-align: center;
    }

    .form-group input {
        width: 100%;
        padding: 9px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 4px;
    }

    .input-container {
        position: relative;
        width: 100%;
    }

    .input-container input {
        padding-right: 40px;
    }

    
/* 目のアイコンボタン */
.toggle-icon {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 28px;
    height: 28px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    cursor: pointer;
}

/* 自然な目の形 */
.eye-icon {
    position: relative;
    width: 17px;
    height: 12px;
    border: 1.5px solid #666;
    border-radius: 50% 50% 50% 50% / 60% 60% 60% 60%;
    box-sizing: border-box;
}

/* 黒目 */
.eye-icon::after {
    content: "";
    position: absolute;
    width: 5px;
    height: 5px;
    border: 1.5px solid #666;
    border-radius: 50%;
    top: 2px;
    left: 4.5px;
    box-sizing: border-box;
}

/* 非表示のときだけ斜線 */
.toggle-icon.is-hidden .eye-icon::before {
    content: "";
    position: absolute;
    width: 22px;
    height: 1.5px;
    background: #666;
    top: 4px;
    left: -4px;
    transform: rotate(-35deg);
    z-index: 1;
}

    .password-note {
        margin: 5px 0 0;
        font-size: 11px;
        color: #666;
        text-align: center;
    }

    .signup-button {
        width: 130px;
        padding: 10px;
        margin-top: 10px;
        background: #a9c0ed;
        border: 1px solid #8da9df;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
    }
</style>

<script>
    function togglePassword(inputId, button) {
        const input = document.getElementById(inputId);
        const isHidden = input.type === "password";

        input.type = isHidden ? "text" : "password";

        button.classList.toggle("is-hidden", !isHidden);
        button.setAttribute("aria-pressed", String(isHidden));
        button.setAttribute(
            "aria-label",
            isHidden ? "パスワードを隠す" : "パスワードを表示"
        );
    }
</script>

{% endblock %}

{% block bottom_nav %}{% endblock %}
