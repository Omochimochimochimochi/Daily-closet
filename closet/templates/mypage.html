
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイページ - Daily Closet</title>

    <style>
        /* 基本レイアウト */
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            background-color: #f8f9fa;
            font-family: sans-serif;
        }

        .app-container {
            background: white;
            width: 375px;
            max-width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
            padding-bottom: 65px;
        }

        /* コンテンツエリア */
        .content-wrapper {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            padding: 20px 0;
            border-bottom: 1px solid #333;
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0;
        }

        .user-display {
            margin-bottom: 30px;
            font-weight: bold;
            font-size: 1.1rem;
            text-align: center;
            overflow-wrap: anywhere;
        }

        /* 成功・エラーメッセージ */
        .message {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 0 0 20px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .message.success {
            color: #176b35;
            background-color: #e8f5e9;
        }

        .message.error {
            color: #b42318;
            background-color: #fdecea;
        }

        .button-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

.btn {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    min-height: 52px;
    padding: 10px 12px;
    background-color: #e0e0e0;
    color: #333;
    border: 2px solid #555;
    border-radius: 8px;
    text-align: center;
    text-decoration: none;
    font-size: 16px;
    font-weight: bold;
    line-height: 1.4;
    box-sizing: border-box;
}

        .btn:hover {
            background-color: #d5d5d5;
        }

        /* 下部ナビゲーション */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 375px;
            max-width: 100%;
            height: 65px;
            background-color: #d3d3d3;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #bbb;
            box-sizing: border-box;
            z-index: 1000;
        }

        .nav-item {
            text-decoration: none;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .nav-icon {
            font-size: 24px;
            display: block;
        }

        @media (max-width: 375px) {
            .app-container,
            .bottom-nav {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="app-container">

        <div class="content-wrapper">

            <div class="header">
                <h1>マイページ</h1>
            </div>

            <div class="user-display">
                ユーザー：{{ request.user.username }} 様
            </div>

            {% if messages %}
                {% for message in messages %}
                    <p class="message {% if 'success' in message.tags %}success{% elif 'error' in message.tags %}error{% endif %}">
                        {{ message }}
                    </p>
                {% endfor %}
            {% endif %}

            <div class="button-group">

                <a href="{% url 'closet:favorite_list' %}" class="btn">
                    お気に入りアイテム一覧 💗
                </a>

                <a href="{% url 'closet:username_edit' %}" class="btn">
                    ユーザー名変更 👤
                </a>

                <a href="{% url 'closet:email_change' %}" class="btn">
                    メールアドレス変更 💌
                </a>

                <a href="{% url 'closet:password_change' %}" class="btn">
                    パスワード変更 🔑
                </a>

                <a href="{% url 'closet:logout' %}" class="btn">
                    ログアウト 🚪
                </a>

            </div>
        </div>

        <div class="bottom-nav">
            <a href="{% url 'closet:top' %}" class="nav-item">
                <span class="nav-icon">🏠</span>
            </a>

            <a href="{% url 'closet:search_results' %}" class="nav-item">
                <span class="nav-icon">🔍</span>
            </a>

            <a href="{% url 'closet:consideration_list' %}" class="nav-item">
                <span class="nav-icon">🛒</span>
            </a>

            <a href="{% url 'closet:mypage' %}" class="nav-item">
                <span class="nav-icon">👤</span>
            </a>
        </div>

    </div>
</body>
</html>
