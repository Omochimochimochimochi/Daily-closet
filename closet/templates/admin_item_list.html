<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>アイテム一覧(管理) - Daily Closet</title>
    <style>
    body{
       margin:0; background:#f8f9fa; font-family:sans-serif; display:flex; justify-content:center; }

    .app-container{width:100%; max-width:375px; min-height:100vh; background:#fff; position:relative; padding-bottom:80px; box-sizing:border-box; border:1px solid #ddd; }
        
        .header { padding: 15px; border-bottom: 1px solid #eee; text-align: center; font-weight: bold; background: #fff; }
        .item-count { font-size: 12px; color: #666; text-align: center; margin: 10px 0; }
        
        
        .item-card {
    display: flex;
    padding: 12px;
    border-bottom: 1px solid #eee;
    align-items: center;
}

.item-img {
    width: 70px;
    height: 85px;
    background-color: #f0f0f0;
    border: 1px solid #ddd;
    margin-right: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
}

.item-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.item-info {
    flex: 1;
}

.item-name {
    font-size: 14px;
    font-weight: bold;
    color: #333;
    margin: 0 0 4px 0;
}

.item-spec {
    font-size: 12px;
    color: #666;
    margin: 2px 0;
}

.item-price {
    font-size: 13px;
    font-weight: bold;
    color: #d9534f;
    margin: 4px 0 0 0;
}

        
        .footer-nav{
    position:fixed;
    bottom:0;
    width:100%;
    max-width:375px;
    display:flex;
    justify-content:space-around;
    padding:15px 0;
    background:#f0f0f0;
    border-top:1px solid #ddd;
    box-sizing:border-box;
}

        .nav-item { text-decoration: none; font-size: 24px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">アイテム一覧画面</div>
    <p class="item-count">登録アイテム：x点</p>

{% for item in items %}

<div class="item-card">

    <div class="item-img">
        {% if item.image %}
            <img src="{{ item.image.url }}" alt="{{ item.item_name }}">
        {% else %}
            画像なし
        {% endif %}
    </div>

    <div class="item-info">

        <p class="item-name">
            {{ item.item_name }}
        </p>

        <p class="item-spec">
            {{ item.color }}
        </p>

        <p class="item-price">
            ¥ {{ item.price }} (税込)
        </p>

    </div>

</div>

{% empty %}

<p style="text-align:center; color:#999; padding:30px;">
    登録されているアイテムはありません。
</p>

{% endfor %}

    <div class="footer-nav">
        <a href="{% url 'closet:top' %}" class="nav-item">🏡</a>
        <a href="{% url 'closet:admin_item_list' %}" class="nav-item">👕</a>
        <a href="{% url 'closet:admin_menu' %}" class="nav-item">📋</a>
    </div>
</div>

</body>
</html>
