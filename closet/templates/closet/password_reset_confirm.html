
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワード再設定 - Daily Closet</title>

    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 50px 15px;
            background-color: #f8f9fa;
            margin: 0;
        }

        .box {
            background: white;
            padding: 40px;
            border: 1px solid #ddd;
            border-radius: 10px;
            width: 400px;
            max-width: 100%;
            box-sizing: border-box;
            text-align: center;
        }

        h2 {
            font-size: 18px;
            margin-bottom: 30px;
        }

        .django-form-area p {
            text-align: left;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .django-form-area input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .django-form-area ul {
            text-align: left;
            font-size: 11px;
            color: #d9534f;
            padding-left: 20px;
        }

        /* パスワード欄と目のボタン */
        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper input {
            padding-right: 45px;
        }

        .toggle-password {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            height: 32px;
            padding: 0;
            border: none;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-password svg {
            width: 20px;
            height: 20px;
            stroke: #555;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .toggle-password:focus-visible {
            outline: 2px solid #6699dd;
            border-radius: 4px;
        }

        .btn-save {
            background-color: #a0c4ff;
            color: #222;
            border: none;
            padding: 12px;
            width: 80%;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
        }

        .btn-save:hover {
            background-color: #8bb5f5;
        }

        @media (max-width: 480px) {
            body {
                padding: 25px 12px;
            }

            .box {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>
    <div class="box">
        <h2>パスワード再設定画面</h2>

        <form method="post">
            {% csrf_token %}

            <div class="django-form-area">
                {{ form.as_p }}
            </div>

            <button type="submit" class="btn-save">保存</button>
        </form>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const passwordInputs = document.querySelectorAll(
                '.django-form-area input[type="password"]'
            );

            passwordInputs.forEach(function (input, index) {
                const wrapper = document.createElement("div");
                wrapper.className = "password-wrapper";

                input.parentNode.insertBefore(wrapper, input);
                wrapper.appendChild(input);

                const button = document.createElement("button");
                button.type = "button";
                button.className = "toggle-password";
                button.setAttribute("aria-label", "パスワードを表示");
                button.setAttribute("aria-pressed", "false");

                const eyeOpen = `
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                `;

                const eyeClosed = `
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 3l18 18"></path>
                        <path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a15.8 15.8 0 0 1-4 4.8"></path>
                        <path d="M6.6 6.6C3.7 8.4 2 12 2 12s3.5 7 10 7c1.2 0 2.3-.2 3.3-.6"></path>
                        <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>
                    </svg>
                `;

                button.innerHTML = eyeOpen;

                button.addEventListener("click", function () {
                    const isHidden = input.type === "password";

                    input.type = isHidden ? "text" : "password";
                    button.innerHTML = isHidden ? eyeClosed : eyeOpen;
                    button.setAttribute(
                        "aria-label",
                        isHidden ? "パスワードを非表示" : "パスワードを表示"
                    );
                    button.setAttribute(
                        "aria-pressed",
                        isHidden ? "true" : "false"
                    );
                });

                wrapper.appendChild(button);
            });
        });
    </script>
</body>
</html>
