
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワード再設定 - Daily Closet</title>

    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 50px 15px;
            background-color: #f8f9fa;
            margin: 0;
            box-sizing: border-box;
        }

        .box {
            background: white;
            padding: 40px;
            border: 1px solid #ddd;
            border-radius: 10px;
            width: 450px;
            max-width: 100%;
            box-sizing: border-box;
            text-align: center;
        }

        h2 {
            font-size: 24px;
            margin-bottom: 30px;
        }

        p {
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 30px;
            text-align: left;
        }

        .field {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-size: 18px;
            font-weight: bold;
        }

        input[type="email"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }

        .btn-send {
            background-color: #a0c4ff;
            color: #222;
            border: none;
            padding: 14px;
            width: 100%;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-send:hover {
            background-color: #8bb5f5;
        }

        @media (max-width: 480px) {
            body {
                padding: 25px 12px;
            }

            .box {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>
    <div class="box">
        <h2>パスワード再設定画面</h2>

        <p>
            パスワード再設定用のリンクをお送りします。<br>
            メールアドレスをご登録ください。
        </p>

        <form method="post">
            {% csrf_token %}

            <div class="field">
                <label for="email">メールアドレス</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >
            </div>

            <button type="submit" class="btn-send">
                送信
            </button>
            </form>
    </div>

    <script>
        document.querySelector('form').addEventListener('submit', function() {
            const button = this.querySelector('.btn-send');

            button.disabled = true;
            button.textContent = '送信中...';
            button.style.opacity = '0.6';
            button.style.cursor = 'not-allowed';
        });
    </script>

</body>
</html>
