{% extends 'closet/base.html' %}
{% load static %}
{% load humanize %}

{% block extra_css %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
    .detail-container { max-width: 400px; margin: 0 auto; padding: 15px; box-sizing: border-box; }
    .slider-container img { width: 100%; display: block; aspect-ratio: 1/1; object-fit: cover; }
    .price-heart-row { display: flex; justify-content: space-between; align-items: center; margin: 15px 0; }
    .heart-btn { background: none; border: none; cursor: pointer; font-size: 1.5rem; color: #ccc; }
    .heart-btn.is-active { color: #ff5a5f; }
    .selection-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0; }
    .selection-grid select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
    .btn-consideration { display: block; width: 100%; padding: 15px; background: #8e8e8e; color: white; text-align: center; border-radius: 12px; text-decoration: none; font-weight: bold; }
</style>
{% endblock %}

{% block content %}
<div class="detail-container">
    <div class="slider-container">
        {% if item.image %}<img src="{{ item.image.url }}">{% endif %}
    </div>

    <div class="info-wrapper">
        <div class="brand">{{ item.brand_name }}</div>
        <div class="item-name">{{ item.item_name }}</div>
        
        <div class="price-heart-row">
            <div class="price">¥{{ item.price|intcomma }}</div>
            <button id="heart-btn" class="heart-btn {% if is_favorite %}is-active{% endif %}" data-id="{{ item.id }}">
                <i class="{% if is_favorite %}fa-solid{% else %}fa-regular{% endif %} fa-heart"></i>
            </button>
        </div>

        <div class="selection-grid">
            <div><small>サイズ</small><select><option>S</option><option>M</option></select></div>
            <div><small>カラー</small><select><option>ブラック</option></select></div>
            <div><small>個数</small><select><option>1</option></select></div>
        </div>

        <a href="{% url 'closet:consideration_list' %}" class="btn-consideration">
            検討リストへ <i class="fa-solid fa-cart-shopping"></i>
        </a>
    </div>
</div>

<script>
    document.getElementById('heart-btn').addEventListener('click', function() {
        const itemId = this.getAttribute('data-id');
        fetch(`/item/${itemId}/favorite/`, {
            method: 'POST',
            headers: { 'X-CSRFToken': '{{ csrf_token }}', 'Content-Type': 'application/json' },
        })
        .then(r => r.json())
        .then(data => {
            // views.pyが返す値が success になったので、ここも success でチェック
            if (data.status === 'success') {
                this.classList.toggle('is-active');
                const icon = this.querySelector('i');
                icon.classList.toggle('fa-solid');
                icon.classList.toggle('fa-regular');
            }
        });
    });
</script>
{% endblock %}
