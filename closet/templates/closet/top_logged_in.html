
{% extends 'closet/base.html' %}
{% load static %}

{% block title %}Daily closet{% endblock %}

{% block extra_css %}
<style>
.main-visual {
    width: 100%;
    margin: 0;
    padding: 0;
}

.main-visual img {
    width: 100% !important;
    max-width: 100%;
    height: auto !important;
    display: block;
    margin: 0;
}

.welcome-msg {
    text-align: center;
    margin: 15px 0 5px 0;
    font-size: 14px;
    color: #333;
}

/* TOP画面の検索ボタン */
.top-search-btn {
    flex-shrink: 0;
    width: 58px;
    height: 48px;
    padding: 0;
    cursor: pointer;
    background-color: #e0e0e0;
    color: #333;
    border: 1px solid #999;
    border-radius: 8px;
    font-size: 16px;
    box-sizing: border-box;
}

.top-search-btn:hover {
    background-color: #d5d5d5;
}
</style>
{% endblock %}

{% block content %}

<h1 style="text-align: center; margin-top: 20px; font-weight: bold;">
    Daily closet
</h1>

<form action="{% url 'closet:search_results' %}" method="get"
      style="display:flex; align-items:center; gap:5px; width:100%; max-width:375px; margin:0 auto 10px; padding:0 10px; box-sizing:border-box;">

    <input
        type="text"
        name="tag"
        placeholder="キーワードを入力"
        style="display:block; flex:1 1 0%; min-width:0; padding:10px; border:1px solid #ccc; border-radius:5px; box-sizing:border-box;"
    >

    <button
        type="submit"
        class="top-search-btn"
    >
        🔍
    </button>

</form>

<div class="main-visual">
    <img src="{% static 'images/main_visual.jpg' %}" alt="メイン画像">
</div>

<p style="font-size: 14px; color: #666; padding: 0 10px; margin-top: 15px;">
    注目のハッシュタグ：<br>

    <a href="{% url 'closet:search_results' %}?tag=セール"
       style="text-decoration: none; color: #333;">#セール</a>

    <a href="{% url 'closet:search_results' %}?tag=ブラウン"
       style="text-decoration: none; color: #333;">#ブラウン</a>

    <a href="{% url 'closet:search_results' %}?tag=スウェット"
       style="text-decoration: none; color: #333;">#スウェット</a>
</p>

<hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

{% endblock %}

{% block bottom_nav %}
    {{ block.super }}
{% endblock %}
