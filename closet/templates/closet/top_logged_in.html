{% extends 'closet/base.html' %}
{% load static %}

{% block title %}Daily closet{% endblock %}

{% block extra_css %}
<style>
    .main-visual img {
        width: 100% !important;
        height: auto !important;
        display: block;
    }
    .welcome-msg {
        text-align: center; 
        margin: 15px 0 5px 0;
        font-size: 14px;
        color: #333;
    }
</style>
{% endblock %}

{% block content %}
<div class="app-container"> <h1 style="text-align: center; margin-top: 20px; font-weight: bold;">Daily closet</h1>
    
<form action="{% url 'closet:search_results' %}" method="get" 
      style="display: flex; gap: 5px; width: 100%; max-width: 375px; margin: 0 auto; box-sizing: border-box; padding: 0 10px;">
    
    <input type="text" name="q" placeholder="キーワードを入力" 
           style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
    
    <button type="submit" style="padding: 10px 15px; cursor: pointer; background: #eee; border: 1px solid #ccc; border-radius: 5px;">🔍</button>
</form>

    <div class="main-visual">
        <img src="{% static 'images/main_visual.jpg' %}" alt="メイン画像">
    </div>

    <p style="font-size: 14px; color: #666; padding: 0 10px; margin-top: 15px;">
        注目のハッシュタグ：<br>
        <a href="{% url 'closet:search_results' %}?tag=セール" style="text-decoration: none; color: #333;">#セール</a>
        <a href="{% url 'closet:search_results' %}?tag=ブラウン" style="text-decoration: none; color: #333;">#ブラウン</a>
        <a href="{% url 'closet:search_results' %}?tag=スウェット" style="text-decoration: none; color: #333;">#スウェット</a>
    </p>

    <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
</div> {% endblock %}

   

{% block bottom_nav %}
    {{ block.super }}
{% endblock %}
