{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Daily Closet{% endblock %}</title>
    
<style>
    body { font-family: sans-serif; margin: 0; background-color: #f8f9fa; display: flex; justify-content: center; }

    .bottom-nav {
        position: fixed !important;
        bottom: 0 !important;
        left: 50% !important;
        transform: translateX(-50%) !important;
        width: 375px !important;
        height: 65px !important;
        background-color: #d3d3d3 !important;
        z-index: 9999 !important;
        border-top: 1px solid #bbb !important;

        display: flex !important;
        justify-content: space-around !important; /* アイコンを均等配置 */
        align-items: center !important;
         }

    .app-container {
        width: 375px !important;
        margin: 0 auto !important;
        min-height: 100vh !important;
        padding-bottom: 100px !important;
        background: white !important;
        box-sizing: border-box;
    }

    .nav-item { text-decoration: none; width: 50px; height: 50px; display: flex; justify-content: center; align-items: center; }
    .nav-icon { font-size: 24px; display: block; }
</style>

    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="app-container">   
        {% block content %}{% endblock %}
    </div>
    
    {% block bottom_nav %}
    <div class="bottom-nav">
        <a href="{% url 'closet:top' %}" class="nav-item"><span class="nav-icon">🏠</span></a>
        <a href="{% url 'closet:item_search' %}" class="nav-item"><span class="nav-icon">🔍</span></a>
        <a href="{% url 'closet:consideration_list' %}" class="nav-item"><span class="nav-icon">🛒</span></a>
        <a href="{% url 'closet:mypage' %}" class="nav-item"><span class="nav-icon">👤</span></a>
    </div>
    {% endblock %}

    {% block extra_js %}{% endblock %}
</body>
</html>
