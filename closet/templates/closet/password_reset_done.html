
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>送信完了 - Daily Closet</title>

    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 50px 15px;
            background-color: #f8f9fa;
            margin: 0;
            box-sizing: border-box;
        }

        .box {
            background: white;
            padding: 40px;
            border: 1px solid #ddd;
            border-radius: 10px;
            width: 450px;
            max-width: 100%;
            box-sizing: border-box;
            text-align: center;
        }

        h2 {
            font-size: 24px;
            margin-bottom: 35px;
            line-height: 1.5;
        }

        .message {
            font-size: 16px;
            line-height: 2;
            margin-bottom: 35px;
            color: #333;
        }

        .link-back {
            display: inline-block;
            color: #1a73e8;
            text-decoration: underline;
            font-size: 16px;
            cursor: pointer;
        }

        @media (max-width: 480px) {
            body {
                padding: 25px 12px;
            }

            .box {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>
    <div class="box">
        <h2>パスワード再設定メール<br>送信完了画面</h2>

        <div class="message">
            パスワード再設定用メールを送信しました📨<br>
            パスワード再設定用のリンクをお送りしました。<br>
            リンクからパスワードを再設定してください。
        </div>

        <a href="{% url 'closet:login' %}" class="link-back">
            ログイン画面へ戻る🩰
        </a>
    </div>
</body>
</html>
