
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>アイテム登録 - Daily Closet</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 375px;
            max-width: 100%;
            background: white;
            min-height: 100vh;
            padding: 20px 20px 100px;
            border: 1px solid #ddd;
            position: relative;
        }

        h2 {
            font-size: 16px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }

        .form-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .form-group {
            flex: 1;
            min-width: 0;
        }

        .form-group-full {
            width: 100%;
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 11px;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        textarea {
            width: 100%;
            display: block;
            height: 60px;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            resize: none;
            font-size: 14px;
        }

        /* 画像プレビュー */
        .image-preview-box {
            border: 1px solid #333;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #fdfdfd;
            cursor: pointer;
            overflow: hidden;
        }

        .image-preview-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 追加詳細画像 */
        .detail-add-section {
            text-align: center;
            margin-top: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        .detail-add-btn {
            border: 1px dashed #333;
            width: 100%;
            padding: 15px;
            cursor: pointer;
            font-size: 13px;
            border-radius: 5px;
            background: white;
        }

        .thumbnail-list {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px 5px;
        }

        .thumbnail-item {
            position: relative;
            width: 80px;
            height: 80px;
            flex-shrink: 0;
        }

        .thumbnail-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 5px;
        }

        .remove-btn {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #7a7aff;
            color: white;
            border: 2px solid white;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        /* タグ */
        .tag-section-title {
            font-size: 13px;
            font-weight: bold;
            margin: 20px 0 10px;
        }

        .tag-group-label {
            font-size: 12px;
            font-weight: bold;
            margin-top: 15px;
            display: flex;
            align-items: center;
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .free-tag-input-area {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
        }

        .add-tag-btn {
            background: #eee;
            border: 1px solid #ccc;
            padding: 0 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            white-space: nowrap;
        }

        .tag-checkbox {
            display: none;
        }

        .tag-label {
            display: inline-block;
            padding: 6px 14px;
            border: 1px solid #ccc;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            background: white;
            color: #666;
            transition: all 0.2s;
        }

        .tag-checkbox:checked + .tag-label {
            background: #e0e0e0;
            border-color: #bbbbbb;
            color: #333;
        }

        /* 画像選択モーダル */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,.5);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* 編集画面と同じサイズ・配置 */
        .modal-content {
            background: white;
            padding: 20px;
            width: 100%;
            max-width: 335px;
            box-sizing: border-box;
            border-radius: 10px;
            margin: 0;
            position: relative;
        }

        .modal-content h3 {
            font-size: 16px;
            margin: 15px 0;
            text-align: center;
        }

        .modal-close {
            position: absolute;
            top: 10px;
            right: 15px;
            cursor: pointer;
            font-size: 24px;
            color: #999;
        }

        .modal-preview {
            width: 100%;
            height: 200px;
            border: 1px solid #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f9f9f9;
            border-radius: 8px;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .modal-preview img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .modal-thumbnail-list {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .modal-add-label {
            display: block;
            width: 100%;
            padding: 12px;
            background: #a0c4ff;
            color: white;
            text-align: center;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            font-size: 12px;
        }

        /* 保存・キャンセル */
        .save-btn {
            width: 100%;
            background-color: #4f83e6;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 40px;
        }

        .save-btn:hover {
            background: #3f6fd9;
        }

        .cancel-btn {
            display: block;
            width: 100%;
            background-color: #f1f1f1;
            color: #333;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            text-align: center;
            text-decoration: none;
        }

        /* 管理者メニュー */
        .footer-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 375px;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            background: #eee;
            border-top: 1px solid #ddd;
            z-index: 100;
        }

        .footer-nav a {
            font-size: 28px;
            text-decoration: none;
            padding: 5px;
        }
    </style>
</head>

<body>

<div class="app-container">

    <h2>アイテム登録画面</h2>

    {% if messages %}
        {% for message in messages %}
            <p style="color:red;">{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form id="item-form" method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <!-- メイン画像 -->
        <div class="form-group-full">
            <div id="main-preview"
                 class="image-preview-box"
                 style="width:150px;height:180px;"
                 onclick="openModal('main')">
                <p style="font-size:12px;margin:0;">アイテム画像</p>
                <p style="font-size:24px;margin:5px 0;">📷</p>
            </div>

            <input type="file"
                   name="image"
                   id="main-image-input"
                   accept="image/*"
                   style="display:none">
        </div>

        <!-- ブランド名 -->
        <div class="form-group-full">
            <label>ブランド名</label>
            <input type="text" name="brand" placeholder="例：ユニクロ">
        </div>

        <!-- 金額・カラー -->
        <div class="form-row">
            <div class="form-group">
                <label>金額</label>
                <input type="text" name="price" placeholder="¥">
            </div>

            <div class="form-group">
                <label>カラー</label>
                <input type="text" name="color" placeholder="例：White">
            </div>
        </div>

        <!-- カテゴリ -->
        <div style="margin:20px 0;text-align:center;">
            <label style="display:block;font-weight:bold;margin-bottom:8px;">
                カテゴリ
            </label>

            <select name="category"
                    style="width:80%;max-width:320px;padding:10px 14px;border:1px solid #ccc;border-radius:8px;background:#fff;font-size:15px;color:#333;">
                <option value="">選択してください</option>
                <option value="tops">トップス</option>
                <option value="bottoms">ボトムス</option>
                <option value="outer">アウター</option>
            </select>
        </div>

        <!-- アイテム名 -->
        <div class="form-group-full">
            <label style="text-align:center;">アイテム名</label>
            <input type="text"
                   name="name"
                   style="text-align:center;"
                   placeholder="例：デニムシャツ">
        </div>

        <!-- アイテム説明 -->
        <div class="form-group-full">
            <label style="text-align:center;">アイテム説明</label>
            <textarea name="description"
                      placeholder="説明を入力してください"></textarea>
        </div>

        <!-- アイテム詳細 -->
        <div class="form-group-full">
            <label style="text-align:center;">
                アイテム詳細（素材、洗濯表示など）
            </label>

            <textarea name="details_text"
                      placeholder="詳細を入力してください"></textarea>

            <div id="detail-sub-preview"
                 class="image-preview-box"
                 style="width:100px;height:120px;margin-top:10px;"
                 onclick="openModal('detail-sub')">
                <p style="font-size:10px;margin:0;">詳細画像</p>
                <p style="font-size:20px;margin:5px 0;">📷</p>
            </div>

            <input type="file"
                   name="detail_image"
                   id="detail-sub-image-input"
                   accept="image/*"
                   style="display:none">
        </div>

        <!-- 追加詳細画像 -->
        <div class="detail-add-section">

            <p style="font-size:11px;font-weight:bold;margin-bottom:10px;">
                詳細部分（ポケット、裏地など）の画像登録
            </p>

            <div id="thumbnail-container" class="thumbnail-list"></div>

            <button type="button"
                    class="detail-add-btn"
                    onclick="openModal('detail')">
                ＋ 詳細画像を追加
            </button>

            <input type="file"
                   name="additional_images"
                   id="additional-images-input"
                   accept="image/*"
                   multiple
                   style="display:none">
        </div>

        <!-- 自由記入タグ -->
        <label>自由記入タグ</label>

        <div class="free-tag-input-area">
            <input type="text"
                   id="free-tag-input"
                   placeholder="#2Way">

            <button type="button"
                    class="add-tag-btn"
                    onclick="addFreeTag()">
                追加
            </button>
        </div>

        <div id="free-tag-list"
             class="tag-list"
             style="margin-bottom:20px;">
        </div>

        <input type="hidden"
               name="free_tags"
               id="free-tags-hidden"
               value="">

        <!-- 選択タグ -->
        <p class="tag-section-title">タグ（複数選択）</p>

        <div class="tag-group-label">■ スタイル</div>
        <div class="tag-list">
            <label>
                <input type="checkbox" name="style" value="シンプル" class="tag-checkbox">
                <span class="tag-label">#シンプル</span>
            </label>

            <label>
                <input type="checkbox" name="style" value="きれいめ" class="tag-checkbox">
                <span class="tag-label">#きれいめ</span>
            </label>

            <label>
                <input type="checkbox" name="style" value="Aライン" class="tag-checkbox">
                <span class="tag-label">#Aライン</span>
            </label>
        </div>

        <div class="tag-group-label">■ 骨格タイプ</div>
        <div class="tag-list">
            <label>
                <input type="checkbox" name="kokkaku" value="ストレート" class="tag-checkbox">
                <span class="tag-label">#ストレート</span>
            </label>

            <label>
                <input type="checkbox" name="kokkaku" value="ウェーブ" class="tag-checkbox">
                <span class="tag-label">#ウェーブ</span>
            </label>

            <label>
                <input type="checkbox" name="kokkaku" value="ナチュラル" class="tag-checkbox">
                <span class="tag-label">#ナチュラル</span>
            </label>
        </div>

        <div class="tag-group-label">■ パーソナルカラー</div>
        <div class="tag-list">
            <label>
                <input type="checkbox" name="personal_color" value="イエベ" class="tag-checkbox">
                <span class="tag-label">#イエベ</span>
            </label>

            <label>
                <input type="checkbox" name="personal_color" value="ブルベ" class="tag-checkbox">
                <span class="tag-label">#ブルベ</span>
            </label>

            <label>
                <input type="checkbox" name="personal_color" value="ニュートラル" class="tag-checkbox">
                <span class="tag-label">#ニュートラル</span>
            </label>
        </div>

        <button type="submit" class="save-btn">保存</button>

        <a href="{% url 'closet:inventory_manage' %}"
           class="cancel-btn">
            キャンセル
        </a>

    </form>
</div>

<!-- 画像選択モーダル -->
<div id="image-modal"
     class="modal-overlay"
     onclick="closeModal()">

    <div class="modal-content" onclick="event.stopPropagation()">

        <span class="modal-close" onclick="closeModal()">&times;</span>

        <h3>カメラロール</h3>

        <div id="modal-main-preview" class="modal-preview">
            画像を選択してください
        </div>

        <div id="modal-thumbnail-list" class="modal-thumbnail-list"></div>

        <label class="modal-add-label">
            ＋ 写真を追加
            <input type="file"
                   id="modal-file-input"
                   accept="image/*"
                   style="display:none"
                   onchange="handleImageUpload(event)">
        </label>

    </div>
</div>

<!-- 管理者メニュー -->
<div class="footer-nav">
    <a href="{% url 'closet:admin_menu' %}">🏠</a>
    <a href="{% url 'closet:inventory_manage' %}">👗</a>
    <a href="{% url 'closet:admin_item_list' %}">📋</a>
</div>

<script>
    let currentTarget = '';
    let additionalFiles = [];

    // モーダルを開く
    function openModal(target) {
        currentTarget = target;

        document.getElementById('image-modal').style.display = 'flex';

        document.getElementById('modal-main-preview').innerHTML =
            '画像を選択してください';

        document.getElementById('modal-thumbnail-list').innerHTML = '';
    }

    // モーダルを閉じる
    function closeModal() {
        document.getElementById('image-modal').style.display = 'none';
    }

    // 追加画像をinputに反映
    function syncAdditionalFilesToInput() {
        const dataTransfer = new DataTransfer();

        additionalFiles.forEach(file => {
            dataTransfer.items.add(file);
        });

        document.getElementById('additional-images-input').files =
            dataTransfer.files;
    }

    // 画像アップロード
    function handleImageUpload(event) {
        const file = event.target.files[0];

        if (!file) return;

        const reader = new FileReader();

        reader.onload = function(e) {
            const imageUrl = e.target.result;

            if (currentTarget === 'main') {

                document.getElementById('main-preview').innerHTML =
                    `<img src="${imageUrl}" alt="アイテム画像">`;

                const dt = new DataTransfer();
                dt.items.add(file);

                document.getElementById('main-image-input').files =
                    dt.files;

            } else if (currentTarget === 'detail-sub') {

                document.getElementById('detail-sub-preview').innerHTML =
                    `<img src="${imageUrl}" alt="詳細画像">`;

                const dt = new DataTransfer();
                dt.items.add(file);

                document.getElementById('detail-sub-image-input').files =
                    dt.files;

            } else if (currentTarget === 'detail') {

                additionalFiles.push(file);

                syncAdditionalFilesToInput();

                const container =
                    document.getElementById('thumbnail-container');

                const div = document.createElement('div');
                div.className = 'thumbnail-item';

                const img = document.createElement('img');
                img.src = imageUrl;

                const removeBtn = document.createElement('button');
                removeBtn.type = 'button';
                removeBtn.className = 'remove-btn';
                removeBtn.textContent = '×';

                removeBtn.onclick = function() {
                    const index = additionalFiles.indexOf(file);

                    if (index > -1) {
                        additionalFiles.splice(index, 1);
                    }

                    syncAdditionalFilesToInput();
                    div.remove();
                };

                div.appendChild(img);
                div.appendChild(removeBtn);
                container.appendChild(div);
            }

            closeModal();

            // 同じ画像を再選択できるようにする
            event.target.value = '';
        };

        reader.readAsDataURL(file);
    }

    // 自由記入タグをhiddenに反映
    function syncFreeTagsToHiddenInput() {
        const tags = Array.from(
            document.querySelectorAll('#free-tag-list .tag-label')
        ).map(el => el.innerText.replace(/^#/, ''));

        document.getElementById('free-tags-hidden').value =
            tags.join(',');
    }

    // 自由記入タグを追加
    function addFreeTag() {
        const input = document.getElementById('free-tag-input');

        if (!input.value.trim()) return;

        const value = input.value.trim();

        const list = document.getElementById('free-tag-list');

        const tag = document.createElement('span');
        tag.className = 'tag-label';
        tag.style.background = '#eee';

        tag.innerText = value.startsWith('#') ? value : '#' + value;

        tag.onclick = function() {
            this.remove();
            syncFreeTagsToHiddenInput();
        };

        list.appendChild(tag);

        input.value = '';

        syncFreeTagsToHiddenInput();
    }

    // Enterキーでフォーム送信されないようにする
    document.getElementById('free-tag-input').addEventListener(
        'keydown',
        function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                addFreeTag();
            }
        }
    );
</script>

</body>
</html>
