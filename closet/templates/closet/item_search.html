{% extends 'closet/base.html' %}
{% load static %}

{% block extra_css %}
<style>
    /* 全体レイアウト */
    .app-container {
        padding: 20px 15px;
        min-height: 100vh;
        position: relative;
        padding-bottom: 80px; /* フッター用の余白 */
    }

    .search-box-container {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 20px;
        margin-bottom: 30px;
    }

    .search-input {
        flex: 1;
        padding: 12px;
        border: 1px solid #333;
        border-radius: 10px;
        background-color: #f9f9f9;
    }

    .search-section { margin-bottom: 25px; }
    .section-title {
    font-size: 16px;
    font-weight: 600;
    color: #555;
    margin-bottom: 15px;
}
    .search-box-container{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:20px;
    margin-bottom:15px;
}

.search-input{
    flex:1;
    padding:12px;
    border:1px solid #333;
    border-radius:12px;
    font-size:16px;
    box-sizing:border-box;
    background:#fff;
}


.category-box{
    margin-left:34px;
    margin-right:0;
    margin-bottom:30px;
}

.search-input,
.category-select{
    width:100%;
    padding:12px;
    border:1px solid #333;
    border-radius:12px;
    background:#fff;
    font-size:16px;
    box-sizing:border-box;
}

    .tag-group {
        display: flex;
        flex-wrap: nowrap;
        overflow-x: auto;
        gap: 10px;
        padding: 10px 0;
        -webkit-overflow-scrolling: touch;
        width: 100%;
        max-width: 345px;
        
        /* スクロールバーを消すための設定 */
        scrollbar-width: none;      /* Firefox */
        -ms-overflow-style: none;   /* IE, Edge */
    }
    .tag-btn.active{
    background:#333;
    color:#fff;
}
    /* Chrome, Safari, Opera用 */
    .tag-group::-webkit-scrollbar {
        display: none;
    }

    /* ボタン交互配色 */
    .tag-btn {
        display: inline-flex;
        padding: 10px 18px;
        border-radius: 8px;
        text-decoration: none;
        color: #333;
        font-size: 0.85rem;
        white-space: nowrap;
    }
    .tag-btn:nth-child(odd) { background-color: #fff; border: 1px solid #999; }
    .tag-btn:nth-child(even) { background-color: #e0e0e0; border: 1px solid #ccc; }
</style>
{% endblock %}

{% block content %}

<form action="{% url 'closet:search_results' %}" method="GET">

    <!-- 検索フォーム -->
    <div class="search-box-container">
        <input type="hidden" id="selected-tags" name="tag">
        <span class="back-arrow" onclick="history.back()">〈</span>


        <input
            type="text"
            name="tag"
            class="search-input"
            placeholder="キーワード、ハッシュタグ">
    </div>

    <!-- カテゴリ -->
    <div class="category-box">
        <select name="category" class="category-select">
            <option value="">カテゴリ</option>
            <option value="tops">トップス</option>
            <option value="bottoms">ボトムス</option>
            <option value="outer">アウター</option>
        </select>
    </div>

    <button type="submit" style="display:none;"></button>

</form>

<!-- トレンドワード -->
<div class="search-section">
    <p class="section-title">トレンドワード</p>

    <div class="tag-group">
        {% for tag in trending_tags %}
        <button
            type="button"
            class="tag-btn"
            data-tag="{{ tag }}">
            #{{ tag }}
        </button>
        {% endfor %}
    </div>
</div>

<!-- 体型・好み -->
<div class="search-section">
    <p class="section-title">体型・好みで探す</p>

    <div class="tag-group">
        {% for tag in category_tags %}
        <button
            type="button"
            class="tag-btn"
            data-tag="{{ tag }}">
            #{{ tag }}
        </button>
        {% endfor %}
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
    // 1. Enterキーでの検索実行
    const searchInput = document.querySelector('.search-input');
    searchInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            this.form.submit();
        }
    });

    // 2. サジェスト表示の準備（まずはコンソール出力で確認）
    searchInput.addEventListener('input', function() {
        console.log("入力中:", this.value);
        // ここに候補を表示するUI処理を後から追加できます
    });

// 3. マウスドラッグでのスクロール機能を追加
    const sliders = document.querySelectorAll('.tag-group');
    let isDown = false;
    let startX;
    let scrollLeft;

    sliders.forEach(slider => {
        slider.addEventListener('mousedown', (e) => {
            isDown = true;
            slider.classList.add('active'); // 必要ならCSSでcursor: grabbingなどを設定
            startX = e.pageX - slider.offsetLeft;
            scrollLeft = slider.scrollLeft;
        });
        slider.addEventListener('mouseleave', () => isDown = false);
        slider.addEventListener('mouseup', () => isDown = false);
        slider.addEventListener('mousemove', (e) => {
            if (!isDown) return;
            e.preventDefault();
            const x = e.pageX - slider.offsetLeft;
            const walk = (x - startX) * 2; // スクロール速度の調整
            slider.scrollLeft = scrollLeft - walk;
        });
    });
// タグの複数選択
const selected = [];

document.querySelectorAll(".tag-btn").forEach(btn => {

    btn.addEventListener("click", function(){

        const input = document.querySelector(".search-input");

        if(input.value !== ""){
            input.value += " ";
        }

        input.value += this.dataset.tag;
    });

});
</script>
{% endblock %}
