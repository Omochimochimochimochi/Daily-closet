{% extends 'closet/base.html' %}
{% load static %}

{% block extra_css %}
<style>
    /* 全体レイアウト */
    .app-container {
        padding: 20px 15px;
        min-height: 100vh;
        position: relative;
        padding-bottom: 80px; /* フッター用の余白 */
    }

    .search-box-container {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 20px;
        margin-bottom: 30px;
    }

    .search-input {
        flex: 1;
        padding: 12px;
        border: 1px solid #333;
        border-radius: 10px;
        background-color: #f9f9f9;
    }

    .search-section { margin-bottom: 25px; }
    .section-title { font-size: 0.9rem; color: #666; margin-bottom: 12px; }

    /* フッターを完全に固定 */
    .bottom-nav {
         position: fixed !important;
        bottom: 0 !important;
        left: 50% !important;
        transform: translateX(-50%) !important;
        width: 375px !important;
        z-index: 9999 !important;
    }

/* コンテナが画面を正しく埋めるように */
    .app-container {
        width: 375px;
        margin: 0 auto;
        min-height: 100vh;
        padding: 20px 15px;
        padding-bottom: 100px; /* フッターに被らないよう余裕を増やす */
       box-sizing: border-box;
       position: relative;
      background: white;
    }

    .tag-group {
        display: flex;
        flex-wrap: nowrap;
        overflow-x: auto;
        gap: 10px;
        padding: 10px 0;
        -webkit-overflow-scrolling: touch;
        width: 100%;
        max-width: 345px;
        
        /* スクロールバーを消すための設定 */
        scrollbar-width: none;      /* Firefox */
        -ms-overflow-style: none;   /* IE, Edge */
    }
    
    /* Chrome, Safari, Opera用 */
    .tag-group::-webkit-scrollbar {
        display: none;
    }

    /* ボタン交互配色 */
    .tag-btn {
        display: inline-flex;
        padding: 10px 18px;
        border-radius: 8px;
        text-decoration: none;
        color: #333;
        font-size: 0.85rem;
        white-space: nowrap;
    }
    .tag-btn:nth-child(odd) { background-color: #fff; border: 1px solid #999; }
    .tag-btn:nth-child(even) { background-color: #e0e0e0; border: 1px solid #ccc; }
</style>
{% endblock %}

{% block content %}

<form action="{% url 'closet:search_results' %}" method="GET" class="search-box-container" style="display: flex; align-items: center; gap: 10px; margin-bottom: 30px;">
    <span class="back-arrow" onclick="history.back()" style="cursor: pointer;">〈</span>
    
    <input type="text" name="tag" class="search-input" placeholder="キーワード、ハッシュタグで検索" 
           style="flex: 1; padding: 12px; border: 1px solid #333; border-radius: 10px; background-color: #f9f9f9;">
    
    <button type="submit" style="display:none;"></button>
</form>
<div class="search-section">
    <p class="section-title">トレンドワード</p>
    <div class="tag-group">
        {% for tag in trending_tags %}
            <a href="{% url 'closet:search_results' %}?tag={{ tag }}" class="tag-btn">#{{ tag }}</a>
        {% endfor %}
    </div>
</div>

<div class="search-section">
    <p class="section-title">体型・好みで探す</p>
    <div class="tag-group">
        {% for tag in category_tags %}
            <a href="{% url 'closet:search_results' %}?tag={{ tag }}" class="tag-btn">#{{ tag }}</a>
        {% endfor %}
    </div>
</div>
</div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // 1. Enterキーでの検索実行
    const searchInput = document.querySelector('.search-input');
    searchInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            this.form.submit();
        }
    });

    // 2. サジェスト表示の準備（まずはコンソール出力で確認）
    searchInput.addEventListener('input', function() {
        console.log("入力中:", this.value);
        // ここに候補を表示するUI処理を後から追加できます
    });

// 3. マウスドラッグでのスクロール機能を追加
    const sliders = document.querySelectorAll('.tag-group');
    let isDown = false;
    let startX;
    let scrollLeft;

    sliders.forEach(slider => {
        slider.addEventListener('mousedown', (e) => {
            isDown = true;
            slider.classList.add('active'); // 必要ならCSSでcursor: grabbingなどを設定
            startX = e.pageX - slider.offsetLeft;
            scrollLeft = slider.scrollLeft;
        });
        slider.addEventListener('mouseleave', () => isDown = false);
        slider.addEventListener('mouseup', () => isDown = false);
        slider.addEventListener('mousemove', (e) => {
            if (!isDown) return;
            e.preventDefault();
            const x = e.pageX - slider.offsetLeft;
            const walk = (x - startX) * 2; // スクロール速度の調整
            slider.scrollLeft = scrollLeft - walk;
        });
    });

</script>
{% endblock %}
