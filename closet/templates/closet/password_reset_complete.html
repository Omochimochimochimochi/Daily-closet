
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワード変更完了 - Daily Closet</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            padding: 40px 12px;
            margin: 0;
            background-color: #f8f9fa;
        }

        .box {
            background: white;
            padding: 40px 30px;
            border: 1px solid #ddd;
            border-radius: 12px;
            width: 500px;
            max-width: 100%;
            text-align: center;
        }

        .box h2 {
            margin-top: 20px;
            margin-bottom: 25px;
            font-size: 26px;
        }

        .box p {
            font-size: 18px;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            background-color: #a0c4ff;
            padding: 12px 28px;
            text-decoration: none;
            color: black;
            border-radius: 10px;
            margin-top: 10px;
            font-size: 18px;
        }

        .btn:hover {
            opacity: 0.85;
        }

        @media (max-width: 400px) {
            .box {
                padding: 30px 20px;
            }

            .box h2 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>
    <div class="box">
        <h2>パスワード変更完了</h2>

        <p>新しいパスワードの設定が完了しました👗</p>

        <a href="{% url 'closet:login' %}" class="btn">
            ログイン画面へ🩰
        </a>
    </div>
</body>
</html>
