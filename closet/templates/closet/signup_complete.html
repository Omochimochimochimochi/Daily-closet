
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登録完了 - Daily Closet</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background-color: #f8f9fa;
        }

        .box {
            background: white;
            padding: 40px 30px;
            border: 1px solid #333;
            width: 100%;
            max-width: 410px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
        }

        .check-icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 1.3rem;
            color: #333;
            margin: 0 0 5px;
        }

        .thank-you {
            font-size: 1.1rem;
            color: #666;
            margin: 70px 0 45px;
        }

        .btn {
            display: block;
            width: 100%;
            max-width: 250px;
            margin: 0 auto 30px;
            padding: 14px 12px;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        .btn-blue {
            background-color: #a0c4ff;
            color: white;
            border: 1px solid #568cff;
        }

        .btn-blue:hover {
            background-color: #8db5f0;
        }

        .btn-white {
            background-color: white;
            color: #333;
            border: 2px solid #555;
        }

        .btn-white:hover {
            background-color: #eee;
        }

        @media (max-width: 400px) {
            .box {
                padding: 30px 20px;
            }

            .thank-you {
                margin: 50px 0 35px;
            }
        }
    </style>
</head>

<body>
    <div class="box">

        <div class="check-icon">✅</div>

        <h2>登録完了しました！</h2>

        <p class="thank-you">Thank You</p>

        <a href="{% url 'closet:top' %}" class="btn btn-blue">
            トップへ戻る
        </a>

        <a href="{% url 'closet:mypage' %}" class="btn btn-white">
            マイページ画面へ
        </a>

    </div>
</body>
</html>
