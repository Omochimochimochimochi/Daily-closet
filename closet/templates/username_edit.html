
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ユーザー名変更 - Daily Closet</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            background: #f8f9fa;
            font-family: sans-serif;
        }

        .app-container {
            background: white;
            width: 375px;
            max-width: 100%;
            min-height: 100vh;
            box-sizing: border-box;
            padding: 20px;
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin: 20px 0 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
        }

        button,
        .back-link {
            display: block;
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            border: none;
            border-radius: 12px;
            box-sizing: border-box;
            text-align: center;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button {
            background: #7eb6ff;
            color: white;
        }

        .back-link {
            background: #e0e0e0;
            color: #333;
        }

        .message {
            text-align: center;
            margin-bottom: 20px;
            color: #b42318;
        }
    </style>
</head>

<body>
    <div class="app-container">

        <h1>ユーザー名変更 👤</h1>

        {% if messages %}
            {% for message in messages %}
                <p class="message">{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form method="POST"
              action="{% url 'closet:update_username' %}">
            {% csrf_token %}

            <label for="new_username">
                新しいユーザー名
            </label>

            <input
                type="text"
                id="new_username"
                name="new_username"
                value="{{ request.user.username }}"
                maxlength="150"
                required
            >

            <button type="submit">
                変更する
            </button>
        </form>

        <a href="{% url 'closet:mypage' %}"
           class="back-link">
            マイページに戻る
        </a>

    </div>
</body>
</html>
