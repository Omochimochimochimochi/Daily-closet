
{% extends 'closet/base.html' %}

{% block title %}ユーザー名変更 - Daily Closet{% endblock %}

{% block extra_css %}
<style>
.username-container {
    width: 100%;
    max-width: 375px;
    margin: 0 auto;
    padding: 20px;
    box-sizing: border-box;
    background: white;
    min-height: 60vh;
}

.username-container h1 {
    text-align: center;
    font-size: 1.5rem;
    margin: 20px 0 30px;
}

/* 入力フォームを中央に配置 */
.username-container form {
    width: 100%;
    max-width: 300px;
    margin: 0 auto;
}

.username-container label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
    text-align: center;
}

.username-container input {
    display: block;
    width: 100%;
    padding: 12px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 16px;
}

/* ボタン共通設定 */
.username-container button,
.username-container .back-link {
    display: block;
    width: 70%;
    max-width: 250px;
    padding: 15px;
    margin: 20px auto 0;
    border: 1px solid #4a90e2;
    border-radius: 15px;
    box-sizing: border-box;
    text-align: center;
    text-decoration: none;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

/* 変更するボタン */
.username-container button {
    background-color: #d1e3ff;
    color: #1e40af;
}

.username-container button:hover {
    background-color: #7ab3ff;
}

/* マイページに戻るボタン */
.username-container .back-link {
    background-color: #e0e0e0;
    color: #333;
    border-color: #ccc;
}

.username-container .back-link:hover {
    background-color: #d0d0d0;
}

/* メッセージ */
.username-container .message {
    text-align: center;
    margin-bottom: 20px;
    color: #b42318;
}
</style>
{% endblock %}

{% block content %}
<div class="username-container">

    <h1>ユーザー名変更 👤</h1>

    {% if messages %}
        {% for message in messages %}
            <p class="message">{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST"
          action="{% url 'closet:update_username' %}">
        {% csrf_token %}

        <label for="new_username">
            新しいユーザー名
        </label>

        <input
            type="text"
            id="new_username"
            name="new_username"
            value="{{ request.user.username }}"
            maxlength="150"
            required
        >

        <button type="submit">
            変更する
        </button>
    </form>

    <a href="{% url 'closet:mypage' %}"
       class="back-link">
        マイページに戻る
    </a>

</div>
{% endblock %}
